[package]
name = "lightdm"
version = "0.1.0"
edition = "2024"

[package.metadata.docs.rs]
all-features = true

[dependencies]
libc = "0.2"
bitflags = "2.2"

[dependencies.ffi]
package = "lightdm-sys"
path = "./lightdm-sys"

[dependencies.gio]
package = "gio"
git = "https://github.com/gtk-rs/gtk-rs-core"

[dependencies.glib]
package = "glib"
git = "https://github.com/gtk-rs/gtk-rs-core"

[dependencies.gobject]
package = "gobject-sys"
git = "https://github.com/gtk-rs/gtk-rs-core"

[features]
v1_11_1 = ["ffi/v1_11_1"]
